version: "3.8"

services:
  db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PLUGIN_VERSION: "0.2.1"
    image: my-sonarqube-with-rust:latest
    container_name: sonarqube
    depends_on:
      db:
        condition: service_healthy   # 環境により無効ならentrypoint待ち等を使う
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9000/api/system/status | grep -qE '\"status\":\"(UP|STARTING)\"'"]
      interval: 15s
      timeout: 5s
      retries: 40

volumes:
  sonarqube_db:
  sonarqube_data:
  sonarqube_logs: