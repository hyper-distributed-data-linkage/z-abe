[package]
name = "z-abe"
version = "0.1.0"
edition = "2021"

[dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.101"
arc-swap = "1.7.1"
async-trait = "0.1.89"
base64 = "0.22.1"
const_format = "0.2.35"
log = "0.4.29"
openssl = "0.10.75"
postcard = { version = "1.1.3", features = ["alloc"] }
rabe = "0.4.2"
serde = "1.0.228"
serde_bytes = "0.11.19"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = "1.49.0"
zenoh = "1.7.2"
tracing = "0.1"
tracing-log = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tracing-appender = "0.2"

[dev-dependencies]
env_logger = "0.11.9"
serial_test = "3.3.1"
test-log = "0.2.19"
