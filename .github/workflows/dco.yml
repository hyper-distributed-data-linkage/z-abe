name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check-sign-off:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.1
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          failed=0
          base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          commits=$(git rev-list --no-merges "$base".."$HEAD_SHA")
          if [ -z "$commits" ]; then
            echo "No commits to check."
            exit 0
          fi
          for sha in $commits; do
            subject=$(git show -s --format='%s' "$sha")
            author_name="$(git show -s --format='%an' "$sha")"
            author="$(git show -s --format='%an <%ae>' "$sha")"
            committer="$(git show -s --format='%cn <%ce>' "$sha")"
            body=$(git show -s --format='%B' "$sha")
            # Skip bot-authored commits (e.g. dependabot[bot]); bots cannot
            # certify the DCO and use varying sign-off addresses.
            case "$author_name" in
              *'[bot]')
                echo "SKIP  $sha  $subject (bot author: $author_name)"
                continue
                ;;
            esac
            if echo "$body" | grep -qxF "Signed-off-by: $author" \
              || echo "$body" | grep -qxF "Signed-off-by: $committer"; then
              echo "PASS  $sha  $subject"
            else
              echo "FAIL  $sha  $subject"
              echo "      expected 'Signed-off-by: $author'"
              echo "      or       'Signed-off-by: $committer'"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a valid Signed-off-by line."
            echo "See CONTRIBUTING.md — sign off with: git commit -s"
            exit 1
          fi
          echo ""
          echo "All commits are signed off."
